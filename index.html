<!doctype html>
<html lang="sa" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GranthaKosha — Durgāsaptaśatī Reader</title>
  <meta name="description" content="Offline-first Sanskrit scripture + multi-commentary reader" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f1420" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <a class="skip" href="#reader">Skip to reader</a>
  <header class="topbar">
    <div class="brand">GranthaKosha <small>ग्रन्थकोश</small></div>
    <div class="spacer"></div>
    <label>Language
      <select id="lang" aria-label="Language">
        <option value="sa">संस्कृतम्</option>
        <option value="en">English</option>
      </select>
    </label>
    <label>Theme
      <select id="theme" aria-label="Reading theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="sepia">Sepia</option>
      </select>
    </label>
    <label>Script
      <select id="script" aria-label="Script toggle">
        <option value="deva">Devanagari</option>
        <option value="iast">IAST</option>
      </select>
    </label>
    <label>Aa <input id="fontsize" type="range" min="15" max="28" value="19" aria-label="Font size" /></label>
    <label>Lh <input id="lineheight" type="range" min="1.5" max="2.8" step="0.1" value="2" aria-label="Line height" /></label>
    <input id="search" type="search" placeholder="Search (/)" aria-label="Search passages" />
    <select id="scope" aria-label="Search scope">
      <option value="all">All</option>
      <option value="mula">Mūla</option>
      <option value="tika">Ṭīkā</option>
    </select>
    <input id="author" type="text" placeholder="author…" aria-label="Filter by commentator" style="width:7em" />
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Library">
      <h2>Scriptures</h2>
      <div id="scriptureList"></div>
      <h2 style="margin-top:1rem">Backup</h2>
      <div class="row">
        <button id="exportBtn" class="btn">Export JSON</button>
      </div>
      <h2 style="margin-top:1rem">Keys</h2>
      <div class="status"><span class="kbd">j</span>/<span class="kbd">k</span> navigate · <span class="kbd">o</span> toggle · <span class="kbd">/</span> search · <span class="kbd">t</span> theme</div>
    </aside>
    <main class="reader" id="reader" aria-label="Reader">
      <div id="readerHead"></div>
      <div id="passages"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
  <div id="overlay" hidden></div>
  <aside id="drawer" aria-label="Focused commentary" hidden>
    <div class="row">
      <strong id="drawerTitle">Ṭīkā focus</strong>
      <div class="spacer"></div>
      <button id="drawerClose" class="btn" aria-label="Close commentary drawer">✕</button>
    </div>
    <div class="meta" id="drawerMeta"></div>
    <label>Commentary <select id="drawerSelect" aria-label="Choose commentary"></select></label>
    <div class="body" id="drawerBody" style="white-space:pre-wrap"></div>
  </aside>
</body>
</html>
